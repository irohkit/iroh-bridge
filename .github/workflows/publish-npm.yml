name: publish-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./packages/iroh-fetch/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          # Ubuntu's packaged binaryen is too old: its wasm-opt exports the wrong table and the
          # module fails to load. Use a pinned upstream release instead.
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_125/bin" >> "$GITHUB_PATH"
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with a placeholder token that npm would use
          # instead of the trusted-publishing (OIDC) exchange.

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN secret is used.
      - run: npm install -g npm@latest

      - name: Smoke-test the built package
        working-directory: packages/iroh-fetch
        run: npm test

      - name: Publish
        working-directory: packages/iroh-fetch
        run: npm publish --access public --provenance
