name: publish-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./packages/iroh-fetch/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package version $version"; exit 1; }
          # iroh-gateway reports its crate version (/status, --version); keep it in step with the tag.
          gateway=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gateway/Cargo.toml | head -1)
          test "v$gateway" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != iroh-gateway version $gateway"; exit 1; }

  # The native addon for each platform; published below as iroh-fetch-<platform> packages.
  prebuilds:
    needs: check-version
    uses: ./.github/workflows/native-prebuilds.yml

  publish:
    needs: prebuilds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang
          # Ubuntu's packaged binaryen is too old: its wasm-opt exports the wrong table and the
          # module fails to load. Use a pinned upstream release instead.
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_125/binaryen-version_125-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_125/bin" >> "$GITHUB_PATH"
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: prebuilds

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing (OIDC) needs npm >= 11.5.1; no NPM_TOKEN secret is used.
      - run: npm install -g npm@latest

      - name: Lay out the prebuild packages
        # Writes npm-native/<platform>/ and pins them in iroh-fetch's optionalDependencies.
        run: node scripts/native-packages.mjs prebuilds npm-native

      - name: Smoke-test the built package (WASM and native)
        working-directory: packages/iroh-fetch
        run: |
          mkdir -p native && cp ../../prebuilds/native-linux-x64-gnu/iroh-fetch.linux-x64-gnu.node native/
          IROH_FETCH_BACKEND=wasm npm test
          IROH_FETCH_BACKEND=native npm test
          rm -rf native

      # The platform packages go first, so iroh-fetch never points at versions that don't exist.
      # Already published versions are skipped, so a failed run can simply be re-run. A platform
      # package that can't be published (e.g. trusted publishing not set up for its name yet) is
      # dropped from iroh-fetch's optionalDependencies: that platform then uses the WASM client
      # instead of blocking the release.
      - name: Publish the prebuild packages
        run: |
          missing=""
          for dir in npm-native/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            elif (cd "$dir" && npm publish --access public --provenance); then
              echo "published $name@$version"
            else
              echo "::warning::could not publish $name@$version; that platform falls back to WASM"
              missing="$missing $name"
            fi
          done
          MISSING="$missing" node -e '
            const fs = require("fs"), p = "packages/iroh-fetch/package.json", pkg = JSON.parse(fs.readFileSync(p));
            for (const name of process.env.MISSING.split(" ").filter(Boolean)) delete pkg.optionalDependencies?.[name];
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + "\n");
            console.log("optionalDependencies:", JSON.stringify(pkg.optionalDependencies ?? {}));'

      - name: Publish iroh-fetch
        working-directory: packages/iroh-fetch
        run: npm publish --access public --provenance
