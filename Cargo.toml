[workspace]
resolver = "3"
members = ["crates/proto", "crates/client-core", "crates/gateway", "crates/web-client", "crates/node-client"]

[workspace.dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.release.package.web-client]
opt-level = "z"
