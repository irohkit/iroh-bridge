<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="irohkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BF5"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- the wall a NAT puts between the two sides -->
  <rect x="241" y="214" width="30" height="190" rx="8" fill="#fff" opacity=".28"/>
  <rect x="241" y="252" width="30" height="8" fill="#5B4BF5" opacity=".35"/>
  <rect x="241" y="300" width="30" height="8" fill="#5B4BF5" opacity=".35"/>
  <rect x="241" y="348" width="30" height="8" fill="#5B4BF5" opacity=".35"/>
  <!-- the bridge over it -->
  <path d="M120 340 C 170 120, 342 120, 392 340" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"/>
  <!-- the two endpoints -->
  <circle cx="120" cy="340" r="46" fill="#fff"/>
  <circle cx="392" cy="340" r="46" fill="#fff"/>
  <circle cx="120" cy="340" r="18" fill="#5B4BF5"/>
  <circle cx="392" cy="340" r="18" fill="#14B8A6"/>
</svg>
