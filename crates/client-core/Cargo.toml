[package]
name = "client-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/irohkit/iroh-bridge"
description = "The iroh-http/1 client shared by the WASM (web-client) and native Node.js (node-client) bindings"

[dependencies]
proto = { path = "../proto" }
iroh.workspace = true
anyhow.workspace = true
serde.workspace = true
n0-future = "0.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
bytes = "1"
